name: Market Intelligence UI patch

on:
  push:
    branches:
      - build/v0260-market-intelligence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v0260-market-intelligence
      - name: Patch canonical UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/v022-ui.js')
          source=path.read_text()
          replacements=[
            (
              '.market-read.supports{border-color:var(--green)}.market-read span{display:block;color:var(--muted);font-size:8px;margin-top:2px}',
              '.market-read.supports{border-color:var(--green)}.market-read.confirm{border-color:var(--green);background:rgba(114,220,102,.06);border-radius:7px;padding:7px 8px}.market-read.confirm strong{color:var(--green)}.market-read.conflict{border-color:var(--yellow);background:rgba(225,196,91,.08);border-radius:7px;padding:7px 8px}.market-read.conflict strong{color:var(--yellow)}.market-read.neutral{border-color:#536170;background:rgba(255,255,255,.025);border-radius:7px;padding:7px 8px}.market-read span{display:block;color:var(--muted);font-size:8px;margin-top:2px}'
            ),
            (
              "function focusGames(){var order={A:3,B:2,C:1};return mergedGames().filter(function(g){return !g.final&&['A','B','C'].indexOf(g.grade)>=0&&num(g.projectedCoverRate)>=55}).sort(function(a,b){return order[b.grade]-order[a.grade]||num(b.projectedCoverRate)-num(a.projectedCoverRate)||String(a.kickoffAt).localeCompare(String(b.kickoffAt))})}",
              "function focusMarketRank(g){var key=marketSignalContext(g).key;return key==='confirm'?2:key==='neutral'?1:key==='conflict'?0:1}\nfunction focusTrendRank(g){var b=projectedBucket(g),m=b&&b.momentum||[],last=m.length?m[m.length-1]:null,prev=m.length>1?m[m.length-2]:null,lv=last&&last.cumulative?num(last.cumulative.coverRate):null,pv=prev&&prev.cumulative?num(prev.cumulative.coverRate):null;return lv!==null&&pv!==null?lv>pv?2:lv===pv?1:0:1}\nfunction focusGames(){var order={A:3,B:2,C:1};return mergedGames().filter(function(g){return !g.final&&['A','B','C'].indexOf(g.grade)>=0&&num(g.projectedCoverRate)>=55}).sort(function(a,b){return order[b.grade]-order[a.grade]||focusMarketRank(b)-focusMarketRank(a)||focusTrendRank(b)-focusTrendRank(a)||num(b.projectedCoverRate)-num(a.projectedCoverRate)||String(a.kickoffAt).localeCompare(String(b.kickoffAt))})}"
            ),
            (
              "<div class=\"focus-market\">ML '+e(ml(price))+' · '+e(movementText(g))+'</div><span class=\"consult-read\">",
              "<div class=\"focus-market\">ML '+e(ml(price))+' · '+e(movementText(g))+'</div>'+marketSignalHtml(g)+'<span class=\"consult-read\">"
            )
          ]
          for old,new in replacements:
            count=source.count(old)
            if count!=1:
              raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:100]}')
            source=source.replace(old,new,1)
          path.write_text(source)
          PY
      - name: Commit canonical UI change
        shell: bash
        run: |
          if git diff --quiet -- src/v022-ui.js; then
            echo 'No UI patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v022-ui.js
          git commit -m 'Surface Market Intelligence on qualified game cards [auto-ui-patch]'
          git push origin HEAD:build/v0260-market-intelligence
