name: Team record UI patch

on:
  push:
    branches:
      - build/v0260-team-records

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v0260-team-records
      - name: Patch canonical UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/v022-ui.js')
          source = path.read_text()

          replacements = [
            (
              '.focus-market,.focus-evidence{font-size:8px;color:var(--muted);line-height:1.4;margin-top:4px}',
              '.focus-market,.focus-evidence,.focus-record{font-size:8px;color:var(--muted);line-height:1.4;margin-top:4px}.focus-record{font-weight:800;color:#aab6c4}'
            ),
            (
              '.team-name{font-size:7px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-market{font-size:9px;margin-top:4px;font-weight:850}',
              '.team-name{font-size:7px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-record{font-size:8px;color:#aab6c4;margin-top:2px;font-weight:850}.team-market{font-size:9px;margin-top:4px;font-weight:850}'
            ),
            (
              '.focus-market,.focus-evidence{font-size:11px}',
              '.focus-market,.focus-evidence,.focus-record{font-size:11px}.team-record{font-size:10px}'
            ),
            (
              "function record(b){if(!b)return 'n=0';return Number(b.wins||0)+'-'+Number(b.losses||0)+(Number(b.pushes||0)?'-'+Number(b.pushes||0):'')}",
              "function record(b){if(!b)return 'n=0';return Number(b.wins||0)+'-'+Number(b.losses||0)+(Number(b.pushes||0)?'-'+Number(b.pushes||0):'')}\nfunction teamRecordFor(g,away){return g&&g.teamRecords&&(away?g.teamRecords.away:g.teamRecords.home)||null}\nfunction teamRecordText(r){if(!r)return '—';return Number(r.wins||0)+'-'+Number(r.losses||0)+(Number(r.ties||0)?'-'+Number(r.ties||0):'')}\nfunction matchupRecords(g){return code(g.awayTeam)+' '+teamRecordText(teamRecordFor(g,true))+' · '+code(g.homeTeam)+' '+teamRecordText(teamRecordFor(g,false))}"
            ),
            (
              "</div><div class=\"focus-category\">'+e(cls(projectedClass(g)))",
              "</div><div class=\"focus-record\">'+e(matchupRecords(g))+'</div><div class=\"focus-category\">'+e(cls(projectedClass(g)))"
            ),
            (
              "<div class=\"team-name\">'+e(team)+'</div><div class=\"team-market\">",
              "<div class=\"team-name\">'+e(team)+'</div><div class=\"team-record\">'+e(teamRecordText(teamRecordFor(g,away)))+'</div><div class=\"team-market\">"
            )
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:90]}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Commit canonical UI change
        shell: bash
        run: |
          if git diff --quiet -- src/v022-ui.js; then
            echo 'No UI patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v022-ui.js
          git commit -m 'Show team records on Dashboard and Games [auto-ui-patch]'
          git push origin HEAD:build/v0260-team-records
