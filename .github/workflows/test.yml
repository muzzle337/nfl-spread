name: Test

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Week 5 production dashboard data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://nfl-spread-api.sanro4.workers.dev'
          def get(path):
              with urllib.request.urlopen(base+path, timeout=45) as r:
                  return json.load(r)
          movement=get('/api/lines/movement/dashboard?season=2026&week=5')
          dashboard=get('/api/dashboard/nfl?season=2026&week=5')
          moves=movement.get('movements') or []
          qualifying=[m for m in moves if isinstance(m.get('movementMagnitude'),(int,float)) and abs(m.get('movementMagnitude'))>=1.0]
          print('WEEK5_MOVEMENTS='+json.dumps(qualifying,separators=(',',':')))
          games=dashboard.get('games') or []
          qids={str(m.get('gameId')) for m in qualifying}
          qgames=[g for g in games if str(g.get('gameId') or g.get('id')) in qids]
          print('WEEK5_DASHBOARD_GAMES='+json.dumps(qgames,separators=(',',':')))
          print('DASHBOARD_TOP_KEYS='+json.dumps(sorted(dashboard.keys())))
          print('DASHBOARD_GAME_KEYS='+json.dumps(sorted(games[0].keys()) if games else []))
          PY
      - name: Install dependencies
        run: npm install
      - name: Run engine tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser regression tests
        run: npm run test:e2e
      - name: Upload v0.22 canonical screen audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v022-canonical-screens
          path: |
            test-results/v022-dashboard.png
            test-results/v022-tier-filter.png
            test-results/v022-week2.png
            test-results/v022-games.png
            test-results/v022-picks.png
            test-results/v022-game-detail.png
            test-results/v022-tools.png
          if-no-files-found: ignore
