name: Test

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run engine tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser regression tests
        run: npm run test:e2e
      - name: Upload Live Focus fixture screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-focus-fixture
          path: test-results/live-focus-fixture.png
          if-no-files-found: ignore
      - name: Upload v0.22 canonical screen audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v022-canonical-screens
          path: |
            test-results/v022-dashboard.png
            test-results/v022-games.png
            test-results/v022-picks.png
            test-results/v022-game-detail.png
          if-no-files-found: ignore
      - name: Upload Game Detail fixture screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-detail-fixture
          path: test-results/game-detail-fixture.png
          if-no-files-found: ignore
