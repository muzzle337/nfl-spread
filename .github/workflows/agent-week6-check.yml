name: Week 11 Three-Week Trend Verification
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read data and calculate weekly momentum
        run: |
          for w in 8 9 10 11; do
            curl -fsS --max-time 30 --retry 2 "https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=$w" -o "w$w.json" || echo "FETCH_ERROR $w"
          done
          python - <<'PY'
          import json,os
          ds={w:json.load(open('w%d.json'%w)) for w in (8,9,10,11) if os.path.isfile('w%d.json'%w)}
          if 11 in ds:
            d=ds[11]
            pulse=d.get('dashboard',{}).get('seasonPulse',{})
            for tier,rows in pulse.get('momentum',{}).items():
              r=[{'w':v['week'],'W':v['weekly']['wins'],'L':v['weekly']['losses'],'P':v['weekly']['pushes'],'pct':v['weekly']['coverRate'],'n':v['weekly']['decisions']} for v in rows if v['week'] in (7,8,9,10)]
              print('TIER_TREND',tier,json.dumps(r,separators=(',',':')))
            for g in d.get('outlooks',{}).get('games',[]):
              h=g.get('history',[])
              m=g.get('move',{})
              print('W11_GAME',json.dumps({'away':g.get('away'),'home':g.get('home'),'awaySpread':g.get('spread',{}).get('away'),'pick':g.get('spread',{}).get('projectedTeam'),'ML':g.get('market',{}).get('awayWinPct'),'move':m.get('direction'),'movePts':m.get('movementMagnitude'),'history':h[:5]},separators=(',',':'))[:2400])
          allgames={}
          for w in (8,9,10):
            if w not in ds:continue
            allgames[w]=ds[w].get('results',{}).get('games',[])
          from collections import defaultdict
          per=defaultdict(list)
          for w,gs in allgames.items():
            for g in gs:
              if g.get('status')!='COMPLETED':continue
              a,h=g['awayTeam'],g['homeTeam'];s1=g['awayScore'];s2=g['homeScore']
              per[a].append({'w':w,'opp':h,'site':'A','pf':s1,'pa':s2,'diff':s1-s2})
              per[h].append({'w':w,'opp':a,'site':'H','pf':s2,'pa':s1,'diff':s2-s1})
          for team,rows in sorted(per.items()):
            print('TEAM3',json.dumps({'team':team,'games':sorted(rows,key=lambda r:r['w']),'avgFor':round(sum(x['pf'] for x in rows)/len(rows),1),'avgAgainst':round(sum(x['pa'] for x in rows)/len(rows),1)},separators=(',',':')))
          if 10 in ds:
            d=ds[10]
            scores={g['id']:g for g in d.get('results',{}).get('games',[])}
            for g in d.get('outlooks',{}).get('games',[]):
              rec=scores.get(g.get('id'))
              if not rec:continue
              p=g.get('spread',{}); side=p.get('projectedTeam')
              m=g.get('market',{})
              if side and isinstance(rec.get('awayScore'),int):
                isaway=side==g.get('away')
                pts=rec['awayScore'] if isaway else rec['homeScore']
                opp=rec['homeScore'] if isaway else rec['awayScore']
                line=p.get('away' if isaway else 'home')
                print('W10_ATS',json.dumps({'game':g.get('id'),'pick':side,'line':line,'margin':pts-opp,'coverMargin':round(pts-opp+line,1),'grade':p.get('grade'),'tierRate':p.get('coverRate')},separators=(',',':')))
          PY
