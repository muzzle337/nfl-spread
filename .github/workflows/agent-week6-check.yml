name: Upcoming Matchup Opponent Difficulty
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read 2026 Week 10 team records
        run: |
          curl -fsS --retry 2 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=10' -o week10.json
          python - <<'PY'
          import json
          d=json.load(open('week10.json'))
          for g in d.get('dashboard',{}).get('games',[]):
            a=g.get('teamRecords',{}).get('away',{});h=g.get('teamRecords',{}).get('home',{})
            print('MATCH',json.dumps({'away':g.get('awayTeam'),'home':g.get('homeTeam'),'awayRecord':a,'homeRecord':h,'status':g.get('status')},separators=(',',':')))
          PY
