name: Week 11 Updated Morning Tier Audit
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only production category trend audit
        run: |
          date -u "+CAPTURE_UTC %Y-%m-%dT%H:%M:%SZ"
          for w in 8 9 10 11; do
            curl -fsS --max-time 25 --retry 1 "https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=$w" -o "w$w.json" || echo "FETCH_FAILED $w"
          done
          python - <<'PY'
          import json,os,collections
          packs={w:json.load(open('w%d.json'%w)) for w in (8,9,10,11) if os.path.exists('w%d.json'%w)}
          for w,p in packs.items():
            r=p.get('results') or {};d=p.get('dashboard') or {}
            fr=p.get('freshness') or {}
            print('WEEK_META',json.dumps({'week':w,'generated':p.get('generatedAt'),'total':r.get('totalGames'),'completed':r.get('completedGames'),'currentSeasonGamesConsidered':d.get('currentSeasonGamesConsidered'),'statsThroughWeek':d.get('statsThroughWeek'),'freshness':{k:{'status':v.get('status'),'updatedAt':v.get('updatedAt')} for k,v in fr.get('sources',{}).items()},'pulseThrough':(d.get('seasonPulse') or {}).get('throughWeek')},separators=(',',':')))
          d=packs[11]
          m=(d.get('dashboard',{}).get('seasonPulse') or {}).get('momentum',{})
          for k,a in m.items():
            r=[{'week':v['week'],'wins':v['weekly']['wins'],'losses':v['weekly']['losses'],'pushes':v['weekly']['pushes'],'n':v['weekly']['decisions'],'rate':v['weekly']['coverRate']} for v in a if v['week']>=8]
            print('TIER_TREND',json.dumps({'tier':k,'weeks':r},separators=(',',':')))
          sp=d.get('signalPerformance') or {}
          for s in sp.get('signals',[]):
            print('SIGNAL',json.dumps({'id':s['id'],'wins':s.get('wins'),'losses':s.get('losses'),'pushes':s.get('pushes'),'rate':s.get('rate'),'byWeek':[x for x in s.get('weeks',[]) if x.get('week',0)>=8]},separators=(',',':')))
          for w,p in packs.items():
            r={g['id']:g for g in (p.get('results') or {}).get('games',[])}
            gs=(p.get('outlooks') or {}).get('games',[])
            for g in gs:
              rec=r.get(g.get('gameId')) or {}
              a,h=g.get('awayTeam'),g.get('homeTeam');sp=g.get('spread') or {}
              cl=g.get('classification') or {}
              move=g.get('movement') or {}
              final=rec.get('final',False)
              ascore,hscore=rec.get('awayScore'),rec.get('homeScore')
              # use game-specific spread from weekly pack, may be postgame/current; record state.
              home_spread=sp.get('home')
              away_spread=sp.get('away')
              if final and isinstance(ascore,int) and isinstance(hscore,int) and isinstance(away_spread,(int,float)):
                mar=(ascore-hscore)+away_spread
                ats='AWAY' if mar>0 else 'HOME' if mar<0 else 'PUSH'
              else:ats=None
              print('GAME',json.dumps({'week':w,'id':g.get('gameId'),'kickoff':g.get('kickoffAt'),'away':a,'home':h,'score':[ascore,hscore] if final else None,'result':rec.get('status'),'class':cl,'line':{'away':away_spread,'home':home_spread,'first':move.get('firstCapturedAwaySpread'),'closing':move.get('closingAwaySpread'),'current':move.get('currentAwaySpread'),'captured':move.get('lastCapturedAt')},'ats':ats,'brain':{'projectedTeam':sp.get('projectedTeam'),'rate':sp.get('coverRate'),'grade':sp.get('grade'),'sampleSize':sp.get('sampleSize'),'status':sp.get('status')},'openingSignal':g.get('openingSignal'),'currentSignal':g.get('currentSignal'),'signalChange':g.get('signalChange')},separators=(',',':'))[:2100])
          PY
