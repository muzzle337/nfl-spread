name: Week 12 Tier Trend and Pool Picks Refresh
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Read week 12 production Brain and trend history
        run: |
          date -u "+CAPTURE_UTC %Y-%m-%dT%H:%M:%SZ"
          curl -fsSL --max-time 26 --retry 1 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=12' -o p.json
          python - <<'PY'
          import json
          p=json.load(open('p.json'))
          f=p.get('freshness',{})
          print('META',json.dumps({'generated':p.get('generatedAt'),'freshness':{k:{'status':v.get('status'),'at':v.get('updatedAt')} for k,v in f.get('sources',{}).items()}},separators=(',',':')))
          pulse=(p.get('dashboard') or {}).get('seasonPulse') or {}
          for k,a in pulse.get('momentum',{}).items():
            print('TIER',json.dumps({'key':k,'overall':pulse.get('buckets',{}).get(k),'weeks':[{'week':x.get('week'),'wins':x.get('weekly',{}).get('wins'),'losses':x.get('weekly',{}).get('losses'),'pushes':x.get('weekly',{}).get('pushes')} for x in a if x.get('week',0)>=8]},separators=(',',':')))
          for g in (p.get('outlooks') or {}).get('games',[]):
            ev=(g.get('history') or {}).get('evidence') or []
            m=g.get('movement') or {};s=g.get('spread') or {}
            print('GAME',json.dumps({'away':g.get('awayTeam'),'home':g.get('homeTeam'),'spread':s.get('away'),'category':g.get('classification'),'winAway':(g.get('market') or {}).get('awayWinPct'),'tierPick':s.get('projectedTeam'),'tierRate':s.get('coverRate'),'grade':s.get('grade'),'first':m.get('firstCapturedAwaySpread'),'current':m.get('currentAwaySpread'),'marketAlign':m.get('marketAlignment'),'hist':[{'team':v.get('team'),'label':v.get('label'),'rate':v.get('coverPct'),'games':v.get('games'),'relation':v.get('relationship')} for v in ev]},separators=(',',':')))
          PY
