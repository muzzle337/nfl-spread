name: Live Week 7 Brain Reconciliation
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest week 7 pack
        run: |
          curl -fsS -A 'Mozilla/5.0 NFL-Spread-Analyst/1.0' 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=7' -o week7.json
          python - <<'PY'
          import json
          d=json.load(open('week7.json'))
          print('GENERATED',d.get('generatedAt'),'SOURCE',d.get('source'))
          print('FRESH',json.dumps(d.get('freshness'),separators=(',',':'))[:2300])
          z=d.get('dashboard') or {}
          for key in ('openingWeekStats','liveWeekStats'):
            print('BUCKET',key,json.dumps((z.get(key) or {}).get('buckets'),separators=(',',':')))
          sp=d.get('signalPerformance') or {}
          for x in sp.get('signals',[]):
            print('SIGNAL',x.get('id'),x.get('metric'),x.get('wins'),x.get('losses'),x.get('pushes'),x.get('rate'),json.dumps(x.get('weeks',[])[-2:],separators=(',',':')))
          for x in (d.get('outlooks') or {}).get('games',[]):
            m=x.get('movement') or {};s=x.get('spread') or {};a=x.get('market') or {}
            print('GAME',x.get('gameId'),x.get('awayTeam'),'@',x.get('homeTeam'),'ATS',s.get('projectedTeam'),s.get('coverRate'),s.get('grade'),'LINE',s.get('away'),'MOVE',m.get('movementMagnitude'),m.get('direction'),'ML%',a.get('awayWinPct'),a.get('homeWinPct'),'STATUS',x.get('status'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: week7-20261025-live-brain
          path: week7.json
