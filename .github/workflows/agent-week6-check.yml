name: Week 11 Brain Trends and Week 10 Postmortem
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only fetch week 8 through 11
        run: |
          for w in 8 9 10 11; do
            curl -fsS --max-time 30 --retry 2 "https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=$w" -o "w$w.json" || echo "FETCH_FAILED $w"
          done
          python - <<'PY'
          import json,os
          for w in (8,9,10,11):
            if not os.path.exists(f'w{w}.json'):continue
            d=json.load(open(f'w{w}.json'))
            print('PACK',w,json.dumps({'generatedAt':d.get('generatedAt'),'freshness':d.get('freshness'),'interpretation':d.get('interpretation')},separators=(',',':'))[:4500])
            for k in ('dashboard','outlooks','signalPerformance','movements','tierContributors'):
              sec=d.get(k,{})
              if isinstance(sec,dict):print('KEYS',w,k,list(sec.keys()))
            dash=d.get('dashboard',{})
            print('PULSE',w,json.dumps(dash.get('seasonPulse'),separators=(',',':'))[:5500])
            print('TREND',w,json.dumps(dash.get('trendWatch'),separators=(',',':'))[:8500])
            print('TIERS',w,json.dumps(dash.get('openingWeekStats',{}).get('buckets',{}),separators=(',',':'))[:6500])
            print('RESULT_META',w,json.dumps({k:v for k,v in d.get('results',{}).items() if k!='games'},separators=(',',':')))
            for g in d.get('results',{}).get('games',[]):
              print('RESULT',w,json.dumps({'id':g.get('id'),'away':g.get('awayTeam'),'home':g.get('homeTeam'),'as':g.get('awayScore'),'hs':g.get('homeScore'),'status':g.get('status')},separators=(',',':')))
            if w in (10,11):
              for g in d.get('outlooks',{}).get('games',[]):
                print('GAME',w,json.dumps({'id':g.get('gameId'),'away':g.get('awayTeam'),'home':g.get('homeTeam'),'kickoff':g.get('kickoffAt'),'market':g.get('market'),'spread':g.get('spread'),'classification':g.get('classification'),'move':g.get('movement'),'history':g.get('historicalEvidence'),'otherKeys':list(g.keys())},separators=(',',':'))[:2800])
              for x in d.get('focus',{}).get('games',[]):
                print('FOCUS',w,json.dumps({'id':x.get('gameId'),'team':x.get('team'),'focus':x.get('focus'),'opportunity':x.get('opportunity'),'edges':x.get('edge'),'conflict':x.get('conflict')},separators=(',',':'))[:1350])
            if w==11:
              print('PERFORMANCE',json.dumps(d.get('signalPerformance',{}),separators=(',',':'))[:11500])
              print('MOVEMENTS',json.dumps(d.get('movements'),separators=(',',':'))[:3500])
              print('CONTRIBUTORS',json.dumps(d.get('tierContributors'),separators=(',',':'))[:4500])
          PY
