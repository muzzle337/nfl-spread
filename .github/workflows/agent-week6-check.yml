name: Live Edge Jets Chargers One-Game Check
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture current Jets Chargers game state
        run: |
          date -u "+SNAPSHOT_UTC %Y-%m-%dT%H:%M:%SZ"
          curl -fsSL --max-time 14 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401873074" -o game.json
          python - <<'PY'
          import json
          d=json.load(open('game.json'))
          h=d.get('header',{}); c=h.get('competitions',[{}])[0]
          print('STATE',json.dumps({'status':c.get('status'),'competitors':[{'name':x.get('team',{}).get('abbreviation'),'score':x.get('score'),'homeAway':x.get('homeAway')} for x in c.get('competitors',[])]},separators=(',',':'))[:1600])
          for t in d.get('boxscore',{}).get('teams',[]):
            print('TEAM',json.dumps({'team':t.get('team',{}).get('abbreviation'),'stats':{q.get('name'):q.get('displayValue') for q in t.get('statistics',[])}},separators=(',',':'))[:3300])
          dr=d.get('drives') or {}
          for x in (dr.get('current'),):
            if isinstance(x,dict):print('DRIVE',json.dumps({'team':x.get('team'),'description':x.get('description'),'plays':x.get('plays',[])[-2:]},separators=(',',':'))[:1400])
          print('KEYS',list(d.keys()))
          PY
          curl -fsSL --max-time 14 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261122&limit=50" -o scores.json
          python - <<'PY'
          import json
          d=json.load(open('scores.json'))
          e=next((x for x in d.get('events',[]) if x.get('id')=='401873074'),{})
          c=(e.get('competitions') or [{}])[0];s=e.get('status',{});sit=c.get('situation') or {}
          print('LIVE',json.dumps({'detail':s.get('type',{}).get('detail'),'period':s.get('period'),'clock':s.get('displayClock'),'teams':[{'name':x.get('team',{}).get('abbreviation'),'score':x.get('score')} for x in c.get('competitors',[])],'possessionId':sit.get('possession'),'down':sit.get('downDistanceText'),'lastPlay':(sit.get('lastPlay') or {}).get('text'),'wp':(sit.get('lastPlay') or {}).get('probability')},separators=(',',':')))
          PY
