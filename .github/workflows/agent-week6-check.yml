name: Live Score Clock Possession Snapshot
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Read ESPN live scoreboard with possession
        run: |
          date -u +"CAPTURE_UTC %Y-%m-%dT%H:%M:%SZ"
          curl -LfsS --retry 1 --max-time 12 -H 'User-Agent: Mozilla/5.0' 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261122&limit=50' -o live.json
          python - <<'PY'
          import json
          d=json.load(open('live.json'))
          print('CAPTURE_COUNT',len(d.get('events',[])))
          for e in d.get('events',[]):
            c=e['competitions'][0]
            cs=c.get('competitors',[])
            teams=[{'name':t.get('team',{}).get('abbreviation'),'score':t.get('score'),'homeAway':t.get('homeAway'),'hasPossession':t.get('hasPossession'),'winner':t.get('winner')} for t in cs]
            s=e.get('status',{})
            print('LIVE',json.dumps({'name':e.get('name'),'eventId':e.get('id'),'state':s.get('type',{}).get('state'),'detail':s.get('type',{}).get('detail'),'period':s.get('period'),'clock':s.get('displayClock'),'teams':teams,'situation':c.get('situation'),'lastPlay':c.get('details')},separators=(',',':'),default=str)[:1500])
          PY
