name: Week 8 Post Thursday Parlay Refresh
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest production pack and print signals
        run: |
          curl -fsS --retry 2 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=8' -o pack.json
          python - <<'PY'
          import json
          d=json.load(open('pack.json'))
          print('FRESHNESS',json.dumps(d.get('freshness'),separators=(',',':'))[:1500])
          print('SIGNALS',[(x['id'],x['wins'],x['losses'],x['pushes']) for x in d.get('signalPerformance',{}).get('signals',[])])
          print('BUCKETS',json.dumps(d.get('dashboard',{}).get('liveWeekStats',{}).get('buckets',{}),separators=(',',':'))[:5000])
          m={x['gameId']:x for x in d.get('movements',[])}
          for x in d.get('outlooks',{}).get('games',[]):
            z=m.get(x['gameId'],{}); s=x.get('spread',{}); ml=z.get('moneyline',{})
            print('GAME',x['awayTeam'],'@',x['homeTeam'],'STATUS',z.get('status'),'ATS',s.get('projectedTeam'),'GRADE',s.get('grade'),'RATE',s.get('coverRate'),'SPREAD',s.get('away'),'FIRST',z.get('firstCapturedAwaySpread'),'NOW',z.get('currentAwaySpread'),'MOVE',z.get('movementMagnitude'),z.get('direction'),'BOOKS',z.get('changedBookmakers'),'ALIGN',z.get('marketAlignment'),'MLMOVE',ml.get('direction'))
          PY
