name: Week 9 Outright Pool Decision Table
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize all Week 9 matchups
        run: |
          curl -fsS --retry 2 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=9' -o w9.json
          python - <<'PY'
          import json
          d=json.load(open('w9.json'))
          for g in d['outlooks']['games']:
            m=g.get('movement',{})
            print('POOL',json.dumps({'id':g.get('gameId'),'away':g['awayTeam'],'home':g['homeTeam'],'market':g.get('market'),'spread':g.get('spread',{}).get('away'),'tierPick':g.get('spread',{}).get('projectedTeam'),'tierCover':g.get('spread',{}).get('coverRate'),'move':m.get('movementMagnitude'),'toward':m.get('direction'),'mlDeltaAway':m.get('moneyline',{}).get('probabilityPointsAway'),'hist':[(e.get('team'),e.get('label'),e.get('coverPct'),e.get('games')) for e in g.get('history',{}).get('evidence',[]) if any(t in e.get('label','') for t in ['Division game','Primetime','Home games','Road games'])][:8]},separators=(',',':')))
          print('FOCUSCOUNT',len(d.get('focus',{}).get('games',[])))
          for f in d.get('focus',{}).get('games',[]):
            print('FOCUS',json.dumps(f,separators=(',',':'))[:500])
          PY
