name: Live Combo Game Check
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN live state
        run: |
          date -u "+SNAPSHOT_UTC %Y-%m-%dT%H:%M:%SZ"
          curl -fsSL --max-time 15 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261122&limit=50' -o scores.json
          python - <<'PY'
          import json
          d=json.load(open('scores.json'))
          for id in ['401873074','401873075','401873069']:
            e=next(x for x in d.get('events',[]) if x.get('id')==id)
            c=e['competitions'][0];s=e.get('status',{});sit=c.get('situation') or {}
            print('LIVE',json.dumps({'id':id,'state':s.get('type',{}).get('detail'),'score':[{'team':t['team']['abbreviation'],'score':t['score']} for t in c['competitors']],'down':sit.get('downDistanceText'),'possession':sit.get('possession'),'lastPlay':(sit.get('lastPlay') or {}).get('text'),'wp':(sit.get('lastPlay') or {}).get('probability')},separators=(',',':')))
          PY
