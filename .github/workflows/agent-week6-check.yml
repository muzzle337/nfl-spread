name: Week 9 Outright Pool Dashboard Snapshot
on:
  push:
    branches: [agent-week6-check-20261017]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read Week 9 production Brain
        run: |
          curl -fsS --retry 2 'https://nfl-spread-api.sanro4.workers.dev/api/analyst/weekly-pack?season=2026&week=9' -o w9.json
          python - <<'PY'
          import json
          d=json.load(open('w9.json'))
          print('TOPLEVEL',list(d))
          print('FRESHNESS',json.dumps(d.get('freshness'),separators=(',',':'))[:2500])
          for k in ['outlooks','focus','movements','dashboard','results','signalPerformance']:
            x=d.get(k)
            print('STRUCT',k,'type',type(x).__name__,'keys',list(x)[:20] if isinstance(x,dict) else 'count '+str(len(x)) if isinstance(x,list) else str(x)[:200])
          print('OUTLOOK SAMPLE',json.dumps(d.get('outlooks',{}).get('games',[])[:2],separators=(',',':'))[:6500])
          print('MOVE SAMPLE',json.dumps(d.get('movements',[])[:2],separators=(',',':'))[:6000])
          print('FOCUS',json.dumps(d.get('focus'),separators=(',',':'))[:9500])
          for g in d.get('outlooks',{}).get('games',[]):
            print('GAME',json.dumps(g,separators=(',',':'))[:3200])
          for m in d.get('movements',[]):
            print('MOVEMENT',json.dumps(m,separators=(',',':'))[:1900])
          PY
