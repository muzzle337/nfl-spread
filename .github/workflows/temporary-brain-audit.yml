name: Read-only Brain audit (temporary)
on:
  push:
    branches: [audit/brain-readonly-week6]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch stored Week 5 Analyst Pack
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nfl-spread-api.sanro4.workers.dev"
          echo "HEALTH"
          curl -fsS --max-time 60 -A "curl/8.5.0" "$BASE/api/health"
          echo
          echo "ANALYST_PACK"
          curl -fsS --max-time 60 -A "curl/8.5.0" "$BASE/api/analyst/weekly-pack?season=2026&week=5" -o /tmp/pack.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/pack.json"))
          print("META",json.dumps({k:d.get(k) for k in ("generatedAt","season","week","source","freshness")},default=str))
          dash=d.get("dashboard",{})
          print("TREND_WATCH",json.dumps(dash.get("trendWatch"),separators=(',',':'),default=str))
          print("SEASON_PULSE",json.dumps(dash.get("seasonPulse"),separators=(',',':'),default=str))
          for g in dash.get("games",[]):
              print("DASH_GAME",json.dumps(g,separators=(',',':'),default=str))
          for g in d.get("focus",{}).get("games",[]) if isinstance(d.get("focus"),dict) else d.get("focus",[]):
              print("FOCUS",json.dumps(g,separators=(',',':'),default=str))
          for g in d.get("outlooks",{}).get("games",[]):
              print("OUTLOOK",json.dumps(g,separators=(',',':'),default=str))
          for g in d.get("movements",[]):
              print("MOVEMENT",json.dumps(g,separators=(',',':'),default=str))
          PY
