name: Team card polish

on:
  push:
    branches:
      - build/v0260-team-card-polish-onepush

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v0260-team-card-polish-onepush
      - name: Apply visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/v022-ui.js')
          source=path.read_text()
          old='.game-top{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);align-items:start}.team{display:flex;gap:7px;align-items:center;min-width:0}.team.home{justify-content:flex-end;text-align:right}.team>div{min-width:0}.logo{width:32px;height:32px;object-fit:contain}.team-code{font-size:14px;font-weight:950}.team-name{font-size:7px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-record{font-size:8px;color:#aab6c4;margin-top:2px;font-weight:850}.team-market{font-size:9px;margin-top:4px;font-weight:850}'
          new='.game-top{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);align-items:start}.team{display:flex;gap:5px;align-items:center;min-width:0}.team.home{justify-content:flex-end;text-align:right}.team>div{min-width:0}.logo{width:26px;height:26px;object-fit:contain;flex:0 0 26px}.team-code{font-size:14px;font-weight:950;line-height:1.05}.team-name{font-size:7px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-record{font-size:8px;color:#b7c2ce;margin-top:2px;font-weight:850;line-height:1.15}.team-market{font-size:9px;margin-top:5px;font-weight:850;line-height:1.2}'
          count=source.count(old)
          if count!=1:
              raise SystemExit(f'Expected one team-card CSS block, found {count}')
          path.write_text(source.replace(old,new,1))
          PY
      - name: Commit polish and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/team-card-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v022-ui.js .github/workflows/team-card-polish.yml
          git commit -m 'Polish team logos and record spacing'
          git push origin HEAD:build/v0260-team-card-polish-onepush
